<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="admin-auth-page">

<main class="auth-card">
  <img src="images/logo.png" alt="Victoria Falls Transporters logo" class="auth-logo">
  <p class="auth-kicker">Victoria Falls Transporters</p>
  <h2>Admin Login</h2>
  <p class="auth-copy">Sign in to manage bookings and accommodation enquiries from one place.</p>

  <form id="loginForm" class="auth-form">
    <input id="username" placeholder="Username" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit" class="auth-submit">Login</button>
  </form>
</main>

<script src="admin-login.js"></script>

</body>
</html>
