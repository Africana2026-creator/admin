<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>

<body class="admin-auth-page">

<main class="auth-card">
  <img src="images/logo.png" alt="Victoria Falls Transporters logo" class="auth-logo">
  <p class="auth-kicker">Victoria Falls Transporters</p>
  <h2>Initial Admin Setup</h2>
 
  <form id="setupForm" class="auth-form">
    <input type="text" id="username" placeholder="Username" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password" required>
    <button class="auth-submit">Create Admin</button>
  </form>
</main>

<script>
const token = localStorage.getItem("adminToken");
if (!token) {
  alert("Unauthorized");
  window.location.href = "index.html";
}

document.getElementById("setupForm").addEventListener("submit", async e => {
  e.preventDefault();

  const res = await fetch(
    "https://vft-backend.onrender.com/api/admin/setup",
    {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: username.value,
        email: email.value,
        password: password.value
      })
    }
  );

  const data = await res.json();

  if (!res.ok) {
    alert(data.message);
    return;
  }

  alert("Admin created successfully");
  window.location.href = "index.html";
});
</script>

</body>
</html>
