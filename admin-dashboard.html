<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard | Victoria Falls Transporters</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./css/style.css">
</head>

<body class="admin-dashboard-page">

<header class="admin-header">
  <div class="admin-header-inner">
    <div class="admin-brand">
      <img src="images/logo.png" alt="Victoria Falls Transporters logo" class="admin-logo">
      <div class="admin-brand-copy">
        <p class="admin-kicker">Victoria Falls Transporters</p>
        <h1>Booking Management Dashboard</h1>
      </div>
    </div>
    <div class="admin-actions">
      <button class="admin-btn-secondary" type="button" onclick="goToEnquiryDashboard()">Enquiry Dashboard</button>
      <button class="admin-btn" type="button" onclick="goToAdminSetup()">Add Admin</button>
      <button class="admin-btn-danger" type="button" onclick="logout()">Logout</button>
    </div>
  </div>
</header>

<main class="dashboard-container">
  <section class="dashboard-intro">
    <h2>Booking overview</h2>
  </section>

  <section class="dashboard-panel">
    <div class="table-shell">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Ref</th>
            <th>Name</th>
            <th>Email</th>
            <th>Total</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="bookingTable"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://localhost:5000"
    : "https://vft-backend.onrender.com";

const token = localStorage.getItem("adminToken");

if (!token) {
  window.location.href = "index.html";
}

/* Logout ONLY on real auth failure */
function handleAuth(res) {
  if (res.status === 401 || res.status === 403) {
    localStorage.removeItem("adminToken");
    alert("Session expired. Please login again.");
    window.location.href = "index.html";
    throw new Error("AUTH_EXPIRED");
  }
  return res;
}

let bookings = [];

fetch(`${API_BASE}/api/admin/bookings`, {
  headers: { Authorization: `Bearer ${token}` }
})
.then(handleAuth)
.then(async res => {
  const data = await res.json().catch(() => ([]));
  if (!res.ok) {
    throw new Error(data.message || "Failed to fetch bookings");
  }
  return data;
})
.then(data => {
  bookings = data;
  renderTable();
})
.catch(err => {
  if (err.message !== "AUTH_EXPIRED") {
    alert(err.message || "Failed to fetch bookings");
  }
});

function renderTable() {
  const table = document.getElementById("bookingTable");
  table.innerHTML = "";

  if (!bookings.length) {
    table.innerHTML = `
      <tr>
        <td colspan="5" style="text-align:center; padding:1rem;">No bookings found</td>
      </tr>`;
    return;
  }

  bookings.forEach(b => {
    table.innerHTML += `
      <tr>
        <td>${b.bookingRef}</td>
        <td>${b.name}</td>
        <td>${b.email}</td>
        <td>$${b.totalPrice}</td>
        <td class="actions">
          <button class="view-btn" onclick="viewBookingServices('${b._id}')">View</button>
          <button class="print" onclick="printReceipt('${b._id}')">Print</button>
          <button class="email" onclick="emailReceipt('${b._id}')">Email</button>
          <button class="delete" onclick="deleteBooking('${b._id}')">Delete</button>
        </td>
      </tr>`;
  });
}

function viewBookingServices(id) {
  const booking = bookings.find(item => item._id === id);
  if (!booking) {
    alert("Booking not found.");
    return;
  }

  const services = Array.isArray(booking.services) && booking.services.length
    ? booking.services.map((s, i) =>
        `${i + 1}. ${s?.name || "Unnamed service"} - $${s?.price ?? 0}`
      ).join("\n")
    : "No services recorded.";

  alert(`
Booking Ref: ${booking.bookingRef}
Customer: ${booking.name}
Email: ${booking.email}
Total: $${booking.totalPrice}

Selected Services:
${services}
`);
}

function printReceipt(id) {
  fetch(`${API_BASE}/api/admin/bookings/${id}/receipt`, {
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(handleAuth)
  .then(res => {
    if (!res.ok) throw new Error("Failed to generate PDF");
    return res.blob();
  })
  .then(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `receipt-${id}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  })
  .catch(err => alert(err.message));
}

function emailReceipt(id) {
  fetch(`${API_BASE}/api/admin/bookings/${id}/email-receipt`, {
    method: "POST",
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(handleAuth)
  .then(async res => {
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.message || "Failed to email receipt");
    }
    return data;
  })
  .then(data => alert(data.message || "Receipt emailed successfully"))
  .catch(err => {
    if (err.message !== "AUTH_EXPIRED") {
      alert(err.message || "Failed to email receipt");
    }
  });
}

function deleteBooking(id) {
  fetch(`${API_BASE}/api/admin/bookings/${id}`, {
    method: "DELETE",
    headers: { Authorization: `Bearer ${token}` }
  })
  .then(handleAuth)
  .then(res => res.json())
  .then(() => {
    bookings = bookings.filter(b => b._id !== id);
    renderTable();
  })
  .catch(err => {
    if (err.message !== "AUTH_EXPIRED") {
      alert(err.message || "Failed to delete booking");
    }
  });
}

function goToAdminSetup() {
  window.location.href = "admin-setup.html";
}

function goToEnquiryDashboard() {
  window.location.href = "enquiry-dashboard.html";
}

function logout() {
  localStorage.removeItem("adminToken");
  window.location.href = "index.html";
}
</script>

</body>
</html>
